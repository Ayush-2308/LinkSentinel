services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: linksentinel
      POSTGRES_USER: linksentinel
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-linksentinel}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linksentinel -d linksentinel"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.3-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/linksentinel
      DATABASE_USER: linksentinel
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-linksentinel}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@linksentinel.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-password123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend
